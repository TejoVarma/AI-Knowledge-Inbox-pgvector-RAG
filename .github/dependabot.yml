# upgrades arrive as monthly pull requests, so CI tests them before anything changes.
# patch and minor bumps are grouped into one PR per ecosystem; majors come one at a time
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      frontend:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
